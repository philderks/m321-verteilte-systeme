server:
  port: 8080

spring:
  application:
    name: gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: service-02
              uri: lb://service-02
              predicates:
                - Path=/api/**
              filters:
                - StripPrefix=1
            - id: service-01
              uri: lb://service-01
              predicates:
                - Path=/service-01/**
              filters:
                - StripPrefix=1
          globalcors:
            cors-configurations:
              '[/**]':
                allowedOrigins:
                  - http://localhost:5173
                allowedMethods:
                  - GET
                  - POST
                  - PUT
                  - DELETE
                  - OPTIONS
                allowedHeaders:
                  - '*'

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
